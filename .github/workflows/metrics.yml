name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Runs daily at midnight
  workflow_dispatch: # Gives you a manual "Run" button to update anytime
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # BASE DESIGN OPTIONS
          output_action: commit
          committer_branch: main
          filename: github-metrics.svg
          config_timezone: Asia/Yangon # Sets your exact timezone
          config_padding: 0, 8%        # Perfectly centers the graphics
          
          # VISUAL STYLING
          base: header, activity, community
          base_indepth: yes
          config_order: base.header, isocalendar, languages # Stack layout order
          
          # PLUGIN: 3D Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year # 6 months keeps it sleek, not overwhelming
          
          # PLUGIN: Coding Languages (The modern ring style)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css # Hides filler code to emphasize real backend/logic skills
